schemaVersion: 1
templates:
  coc.check.success:
    variants:
      - id: whisper
        weight: 3
        text: |
          {{actor.name}}凝视着阴影，阴影给出了答案。
          {{skill.name}}检定：{{roll.total}} / {{target.value}}，成功！
      - id: triumph
        weight: 1
        text: |
          在绝望中，{{actor.name}}找到了希望。
          {{skill.name}}大成功：{{roll.total}} / {{target.value}}
  
  coc.check.failure:
    variants:
      - id: whisper
        weight: 3
        text: |
          {{actor.name}}凝视着阴影，阴影没有回答。
          {{skill.name}}检定：{{roll.total}} / {{target.value}}，失败。
      - id: silence
        weight: 1
        text: |
          真相从{{actor.name}}的指间溜走。
          {{skill.name}}：{{roll.total}} / {{target.value}}，失败...
