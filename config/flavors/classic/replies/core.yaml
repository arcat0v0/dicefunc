schemaVersion: 1
templates:
  bot.name:
    variants:
      - id: default
        weight: 1
        text: Dicefunc
  dice.roll:
    variants:
      - id: standard
        weight: 3
        text: |
          {{actor.name}}掷骰：{{expression}} = {{total}}
          [{{individualRolls}}]
      - id: brief
        weight: 2
        text: |
          {{actor.name}}：{{total}} ({{expression}})
