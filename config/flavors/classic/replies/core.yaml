schemaVersion: 1
templates:
  dice.roll.success:
    variants:
      - id: standard
        weight: 3
        text: |
          {{actor.name}}掷骰：{{expression}} = {{total}}
          [{{individualRolls}}]
      - id: brief
        weight: 2
        text: |
          {{actor.name}}：{{total}} ({{expression}})
  
  dice.roll.failure:
    variants:
      - id: standard
        weight: 3
        text: |
          {{actor.name}}掷骰失败：{{expression}} = {{total}}
          [{{individualRolls}}]
